<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Counters MLBB</title>
    <meta
      name="description"
      content="Counters de heróis do Mobile Legends, rápido e offline."
    />

    <!-- PWA -->
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <!-- ícone da aba = ícone da PWA. Trocou a imagem? Suba o ?v= para o navegador baixar de novo -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=2" />

    <!-- iPhone -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Counters" />

    <!-- Reset recomendado pelo react-native-web -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Counters.</noscript>
    <div id="root"></div>

    <!-- Registra o service worker (modo offline). Desligado no servidor de dev (porta 8081). -->
    <script>
      if ("serviceWorker" in navigator && location.port !== "8081") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
